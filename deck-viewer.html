<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#12161d">
<title>七圣召唤 · 卡牌与牌组浏览器</title>
<!-- 主题在样式表之前落定：读本地偏好，否则跟随系统。内联执行避免浅色用户先看到深色闪一下（FOUC） -->
<script>
try {
  var t = localStorage.getItem("gi-viewer-theme");
  if (t === "light" || (t !== "dark" && matchMedia("(prefers-color-scheme: light)").matches))
    document.documentElement.dataset.theme = "light";
} catch (e) {}
</script>
<!-- ?v= 版本戳：JS/CSS 更新后强制浏览器重新拉取，避免旧缓存文件引发未定义错误 -->
<link rel="stylesheet" href="deck-viewer.css?v=26">
</head>
<body>
<div class="wrap">
  <header>
    <h1>七圣召唤 · 卡牌与牌组浏览器</h1>
    <!-- 全局功能（刷新数据 / 数据信息 / 说明）与牌组无关，放页头；
         牌组专用操作（分享码、导出、历史、对比、概率）跟着牌组视图走 -->
    <div class="hd-actions">
      <button id="btnTheme" title="切换深色 / 浅色主题">☀ 浅色</button>
      <div class="expwrap">
        <button id="btnMore">更多 ▾</button>
        <div class="menu" id="moreMenu">
          <button id="btnSample">加载示例牌组</button>
          <button id="btnRefresh" title="从官方数据服务重新拉取最新数据（失败时自动回退到本地数据）">刷新数据</button>
          <button id="btnDataInfo">数据信息</button>
          <button id="btnHelp">快捷键与说明</button>
        </div>
      </div>
    </div>
    <div class="sub">卡库筛选与检索 · 牌组分享码解析与生成 · 多卡对比与牌组差异 · 概念词典 · 构筑校验 · 多牌组 · 抽牌概率</div>
  </header>

  <div id="status" role="status" aria-live="polite"></div>
  <div id="dataInfo"></div>
  <div id="histPanel"></div>

  <!-- 一级视图：卡库（浏览器的主用途）在前，牌组在后 -->
  <div class="tabs" id="tabs">
    <button class="tab active" data-view="browse">卡库浏览</button>
    <button class="tab" data-view="grid">牌组 · 卡面</button>
    <button class="tab" data-view="list">牌组 · 列表</button>
  </div>

  <!-- 牌组操作条：只在牌组视图出现。卡库浏览时不占顶部空间，
       这也是「分享码输入框不该总是置顶」的直接解法 -->
  <div class="controls" id="deckTools">
    <div class="sugwrap">
      <input id="codeInput" placeholder="粘贴牌组分享码自动解析" spellcheck="false" autocomplete="off">
    </div>
    <button class="primary" id="btnDecode">解析牌组</button>
    <button id="btnCopyCode" disabled>复制分享码</button>
    <div class="expwrap">
      <button id="btnExport" disabled>导出 ▾</button>
      <div class="menu" id="exportMenu">
        <button data-exp="text">文本牌表 · 复制</button>
        <button data-exp="md">Markdown 牌表 · 复制</button>
        <button data-exp="json-copy">结构化 JSON · 复制</button>
        <button data-exp="json-dl">结构化 JSON · 下载</button>
        <button data-exp="csv">CSV · 下载（Excel 可直开）</button>
      </div>
    </div>
    <div class="expwrap">
      <button id="btnDeckTools">牌组工具 ▾</button>
      <div class="menu" id="deckToolsMenu">
        <button id="btnHistory">历史记录</button>
        <button id="btnSkillIdx">技能图鉴</button>
        <button id="btnDeckDiff">牌组对比</button>
        <button id="btnOdds">抽牌概率</button>
        <button id="btnPrint" title="打印当前牌表（列表视图）">打印牌表</button>
      </div>
    </div>
  </div>

  <div class="summary" id="summary"></div>

  <div class="view" id="view-grid"></div>
  <div class="view" id="view-list"></div>
  <div class="view active" id="view-browse"></div>

  <footer>解码与编码逻辑移植自 genius-invokation @gi-tcg/assets-manager（AGPL-3.0） · 卡牌数据缓存于浏览器本地 · 快捷键：1 卡库 / 2 牌组卡面 / 3 牌组列表，/ 聚焦卡库检索框，←/→ 详情翻页，Esc 逐层返回</footer>
</div>

<div id="draftBar"></div>
<div id="draftPanel"></div>
<div id="compareBar"></div>

<div id="toasts"></div>
<div id="overlay"><div class="detail" id="detail"></div></div>

<!-- 拼音索引 / 概念库 / 元素图标已作为 ESM 模块打进 dist/app.js，不再单独加载 -->
<!-- app-sources:start（构建脚本会把这一段整体替换为内联的应用脚本） -->
<!-- TypeScript 源由 scripts/build-app.mjs 打包为单文件 dist/app.js；
     开发时改完源码需重新构建（npm run build:app）。 -->
<script src="dist/app.js?v=26"></script>
<!-- app-sources:end -->
</body>
</html>
