<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<!-- color-scheme 让 UA 从首帧起就用主题底色画画布/滚动条/原生控件——
     没有它，暗色模式下部分内核的滚动条、select 下拉、overscroll 依然是亮色。
     CSS 侧 :root 的 color-scheme 随 data-theme 切换，这里管首帧之前的窗口期 -->
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#12161d">
<meta name="description" content="七圣召唤卡牌与牌组浏览器：牌组分享码解析与生成、卡库多维筛选与机制检索、概念词典、构筑校验、多牌组管理、牌组分享图与二维码。纯前端，单文件离线可用。">
<meta property="og:title" content="七圣召唤 · 卡牌与牌组浏览器">
<meta property="og:description" content="牌组分享码解析与生成、卡库浏览与检索、构筑校验、牌组分享图与二维码。纯前端，单文件离线可用。">
<meta property="og:type" content="website">
<!-- 门面（托管场景）：IM/社交里发链接时给出标题与摘要预览。og:image/og:url 依赖
     未知的部署域名，先不写；favicon 用内联 SVG（金菱 + 深底），不引入额外资源文件 -->
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%2312161d'/><path d='M32 11 51 32 32 53 13 32Z' fill='%23d3bc8e'/><circle cx='32' cy='32' r='7' fill='%2312161d'/></svg>">
<!-- PWA 壳：manifest 与图标是同目录伴生文件（build-single 一并产出，托管部署即获得
     安装/离线能力）。单文件下载版缺失它们时浏览器静默忽略，应用不受影响；
     iOS 主屏图标走 apple-touch-icon（Safari 不认 manifest 图标） -->
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>七圣召唤 · 卡牌与牌组浏览器</title>
<!-- 主题在样式表之前落定：auto/light/dark 三态（默认跟随系统）。内联执行避免浅色用户先看到深色闪一下（FOUC） -->
<script>
try {
  var t = localStorage.getItem("gi-viewer-theme");
  var sysLight = false;
  try { sysLight = matchMedia("(prefers-color-scheme: light)").matches; } catch (e) {}
  if (t === "light" || ((t === null || t === "auto") && sysLight))
    document.documentElement.dataset.theme = "light";
  var f = localStorage.getItem("gi-viewer-fs");
  if (f === "l" || f === "xl") document.documentElement.dataset.fs = f;
} catch (e) {}
/* 引导期错误横幅：应用全局监听注册于 99-main（模块依赖图末段），任一模块求值期
   抛错时它还不存在，页面只会白屏无下文。这里把消息写到 html 属性上，
   由 CSS（html[data-boot-error]::before）渲染成固定横幅——不依赖 DOM 就绪。
   引导完成后（__giBooted）由 99-main 的运行期兜底接管，这里不再动作。 */
window.addEventListener("error", function (ev) {
  try {
    if (window.__giBooted) return;
    var msg = String((ev && (ev.message || (ev.error && ev.error.message))) || "未知错误").slice(0, 140);
    document.documentElement.setAttribute("data-boot-error", msg);
  } catch (e) {}
});
</script>
<!-- ?v= 版本戳：JS/CSS 更新后强制浏览器重新拉取，避免旧缓存文件引发未定义错误 -->
<link rel="stylesheet" href="deck-viewer.css?v=27">
</head>
<body>
<div class="wrap">
  <header>
    <h1>七圣召唤 · 卡牌与牌组浏览器</h1>
    <!-- 全局功能升为图标按钮（悬浮 title 说明）：主题三态 / 刷新 / 帮助。
         原先这些收在「更多」菜单里，点两层才够到；图标内容由 99-main 在启动时注入
         （图标定义单点在 resources）。牌组相关的「加载示例牌组」移入牌组工具菜单。 -->
    <div class="hd-actions">
      <button id="btnTheme" title="主题"></button>
      <button id="btnRandom" title="随便看看：随机打开一张可构筑的卡牌"></button>
      <button id="btnCache" title="资源缓存：卡面离线缓存管理"></button>
      <button id="btnFs" title="字号"></button>
      <button id="btnHelp" title="快捷键与说明（?）"></button>
    </div>
    <div class="sub">卡库筛选与检索 · 牌组分享码解析与生成 · 多卡对比与牌组差异 · 概念词典 · 构筑校验 · 多牌组 · 技能图鉴</div>
  </header>

  <div id="status" role="status" aria-live="polite"></div>
  <div id="histPanel"></div>

  <!-- 一级视图：卡库（浏览器的主用途）在前，牌组在后，图鉴是资料查询页 -->
  <div class="tabs" id="tabs">
    <button class="tab active" data-view="browse">卡库浏览</button>
    <button class="tab" data-view="grid">牌组 · 卡面</button>
    <button class="tab" data-view="list">牌组 · 列表</button>
    <button class="tab" data-view="skills">技能图鉴</button>
  </div>

  <!-- 牌组操作条：只在牌组视图出现。卡库浏览时不占顶部空间，
       这也是「分享码输入框不该总是置顶」的直接解法 -->
  <div class="controls" id="deckTools">
    <div class="sugwrap">
      <input id="codeInput" placeholder="粘贴牌组分享码自动解析" spellcheck="false" autocomplete="off">
    </div>
    <button class="primary" id="btnDecode">解析牌组</button>
    <button id="btnCopyCode" disabled>复制分享码</button>
    <button id="btnCopyLink" disabled title="复制「本页地址 + 分享码」链接，对方打开即解析这套牌组">复制链接</button>
    <div class="expwrap">
      <button id="btnExport" disabled>导出 ▾</button>
      <!-- 导出动作由 95-export 的注册表在启动时注入 -->
      <div class="menu" id="exportMenu"></div>
    </div>
    <div class="expwrap">
      <button id="btnDeckTools">牌组工具 ▾</button>
      <div class="menu" id="deckToolsMenu">
        <button id="btnSample" title="载入一副内置的示例牌组">加载示例牌组</button>
        <button id="btnHistory">历史记录</button>
        <button id="btnDeckDiff">牌组对比</button>
        <button id="btnDeckBackup" title="下载全部牌组与收藏为 JSON 备份文件（跨设备 / 跨站点迁移用）">备份牌组</button>
        <button id="btnDeckRestore" title="从备份文件恢复：按更新时间合并，只增改不删除">恢复牌组…</button>
        <button id="btnTextImport" title="粘贴本工具导出的文本牌表，重建成新牌组（含检查与确认页）">导入文本牌表…</button>
        <button id="btnPrint" title="打印当前牌表（列表视图）">打印牌表</button>
      </div>
    </div>
  </div>

  <div class="summary" id="summary"></div>

  <div class="view" id="view-grid"></div>
  <div class="view" id="view-list"></div>
  <div class="view active" id="view-browse"></div>
  <div class="view" id="view-skills"></div>

  <footer>解码与编码逻辑移植自 genius-invokation @gi-tcg/assets-manager（AGPL-3.0） · 卡牌数据缓存于浏览器本地 · 快捷键：1 卡库 / 2 牌组卡面 / 3 牌组列表 / 4 技能图鉴，/ 聚焦卡库检索框，←/→ 详情翻页，Esc 逐层返回</footer>
</div>

<div id="draftBar"></div>
<div id="draftPanel"></div>
<div id="compareBar"></div>

<div id="toasts"></div>
<div id="overlay"><div class="detail" id="detail"></div></div>

<!-- 拼音索引 / 概念库 / 元素图标已作为 ESM 模块打进 dist/app.js，不再单独加载 -->
<!-- app-sources:start（构建脚本会把这一段整体替换为内联的应用脚本） -->
<!-- TypeScript 源由 scripts/build-app.mjs 打包为单文件 dist/app.js；
     开发时改完源码需重新构建（npm run build:app）。 -->
<script src="dist/app.js?v=27"></script>
<!-- app-sources:end -->
</body>
</html>
