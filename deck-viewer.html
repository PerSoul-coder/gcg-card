<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>七圣召唤 · 卡牌与牌组浏览器</title>
<!-- ?v= 版本戳：JS/CSS 更新后强制浏览器重新拉取，避免旧缓存文件引发未定义错误 -->
<link rel="stylesheet" href="deck-viewer.css?v=26">
</head>
<body>
<div class="wrap">
  <header>
    <h1>七圣召唤 · 卡牌与牌组浏览器</h1>
    <div class="sub">牌组分享码解析与生成 · 卡库浏览（多维筛选 / 排序 / 检索）· 多卡对比与牌组差异 · 概念词典与逐层下钻 · 牌间依赖与构筑校验 · 多牌组管理 · 抽牌概率与费用曲线 ｜ 卡牌数据来自 piovium 官方静态数据服务，规则术语来自 genshin-db 快照</div>
  </header>

  <!-- 操作分层：主条只留高频低门槛动作（输入 / 解析 / 复制 / 导出）；
       历史、示例、刷新、数据信息、说明等次级操作收进「更多 ▾」 -->
  <div class="controls">
    <div class="sugwrap">
      <input id="codeInput" placeholder="粘贴牌组分享码自动解析（卡牌检索请在「卡库浏览」内进行）" spellcheck="false" autocomplete="off">
    </div>
    <button class="primary" id="btnDecode">解析牌组</button>
    <button id="btnCopyCode" disabled>复制分享码</button>
    <div class="expwrap">
      <button id="btnExport" disabled>导出 ▾</button>
      <div class="menu" id="exportMenu">
        <button data-exp="text">文本牌表 · 复制</button>
        <button data-exp="md">Markdown 牌表 · 复制</button>
        <button data-exp="json-copy">结构化 JSON · 复制</button>
        <button data-exp="json-dl">结构化 JSON · 下载</button>
        <button data-exp="csv">CSV · 下载（Excel 可直开）</button>
      </div>
    </div>
    <div class="expwrap">
      <button id="btnMore">更多 ▾</button>
      <div class="menu" id="moreMenu">
        <button id="btnHistory">历史记录</button>
        <button id="btnDeckDiff">牌组对比</button>
        <button id="btnOdds">抽牌概率</button>
        <button id="btnSample">加载示例牌组</button>
        <button id="btnRefresh" title="从官方数据服务重新拉取最新数据（失败时自动回退到本地数据）">刷新数据</button>
        <button id="btnDataInfo">数据信息</button>
        <button id="btnHelp">快捷键与说明</button>
      </div>
    </div>
  </div>
  <div id="status" role="status" aria-live="polite"></div>
  <div id="dataInfo"></div>
  <div id="histPanel"></div>

  <div class="summary" id="summary"></div>

  <div class="tabs" id="tabs">
    <button class="tab active" data-view="grid">卡面视图</button>
    <button class="tab" data-view="list">列表视图</button>
    <button class="tab" data-view="browse">卡库浏览</button>
  </div>

  <div class="view active" id="view-grid"></div>
  <div class="view" id="view-list"></div>
  <div class="view" id="view-browse"></div>

  <footer>解码与编码逻辑移植自 genius-invokation @gi-tcg/assets-manager（AGPL-3.0） · 卡牌数据缓存于浏览器本地 · 快捷键：1/2/3 切视图，/ 聚焦卡库检索框，←/→ 详情翻页，Esc 逐层返回</footer>
</div>

<div id="draftBar"></div>
<div id="draftPanel"></div>
<div id="compareBar"></div>

<div id="toasts"></div>
<div id="overlay"><div class="detail" id="detail"></div></div>

<!-- 拼音索引 / 概念库 / 元素图标已作为 ESM 模块打进 dist/app.js，不再单独加载 -->
<!-- app-sources:start（构建脚本会把这一段整体替换为内联的应用脚本） -->
<!-- TypeScript 源由 scripts/build-app.mjs 打包为单文件 dist/app.js；
     开发时改完源码需重新构建（npm run build:app）。 -->
<script src="dist/app.js?v=26"></script>
<!-- app-sources:end -->
</body>
</html>
